<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Product Designer (Greenhouse location control)</title>
  </head>
  <body>
    <!--
      Trimmed from a live job-boards.greenhouse.io form that has the location
      control enabled (Figma's board; Fubo's does not turn it on).

      The control is a react-select wired to a Pelias geocoder, plus a sibling
      "Locate me" button that calls navigator.geolocation.getCurrentPosition
      and reverse-geocodes the fix. The button is rendered only when the
      geocoding service answered, so its presence means the service is up.
      It sits outside .select, as a sibling in the same .field-wrapper, which
      is why the button search walks up from the combobox rather than looking
      inside the select shell.

      The <input required aria-hidden> is react-select's validation proxy.
    -->
    <h1>Product Designer</h1>

    <div class="field-wrapper">
      <label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label>
      <input id="first_name" class="input" type="text" value="" />
    </div>

    <div class="field-wrapper">
    <div class="select">
    <div class="select__container">
    <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)<span aria-hidden="true">*</span>
    </label>
    <div class="select-shell remix-css-b62m3t-container">
    <span id="react-select-candidate-location-live-region" class="remix-css-7pg0cj-a11yText">
    </span>
    <span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="remix-css-7pg0cj-a11yText">
    </span>
    <div>
    <div class="select__control remix-css-13cymwt-control">
    <div class="select__value-container remix-css-hlgwow">
    <div class="select__placeholder remix-css-1jqq78o-placeholder" id="react-select-candidate-location-placeholder">
    </div>
    <div class="select__input-container remix-css-19bb58m" data-value="">
    <input class="select__input" style="opacity: 1" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="candidate-location" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="candidate-location-error" aria-invalid="false" aria-labelledby="candidate-location-label" aria-required="true" role="combobox" aria-activedescendant="" aria-describedby="react-select-candidate-location-placeholder" enterKeyHint="done" value=""/>
    </div>
    </div>
    <div class="select__indicators remix-css-1wy0on6">
    </div>
    </div>
    </div>
    <input required="" tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""/>
    </div>
    </div>
    </div>
    <button type="button" class="btn--tertiary">Locate me</button>
    </div>

    <div class="field-wrapper">
      <div class="select__container">
        <label id="gender-label" for="gender" class="label select__label">Gender</label>
        <div class="select-shell">
          <div class="select__control">
            <div class="select__value-container">
              <div class="select__placeholder"></div>
              <div class="select__input-container">
                <input id="gender" class="select__input" type="text" role="combobox"
                       aria-autocomplete="list" aria-labelledby="gender-label" value="" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
