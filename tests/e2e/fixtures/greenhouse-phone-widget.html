<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Software Engineer (job-boards.greenhouse.io phone widget)</title>
  </head>
  <body>
    <!--
      Trimmed from the live embed behind
      https://careers.fubo.tv/fubotv-job-openings/?gh_jid=8174865
      (job-boards.greenhouse.io/embed/job_app?for=fubotv&token=8174865).

      What matters here and is NOT in greenhouse-embed-new.html:
        * No `name=` on anything. Every control is addressed by `id=`.
        * Phone is a compound widget: <fieldset class="phone-input"> holds a
          react-select "Country" (the dial code, required) and a separate
          type="tel" input for the national number. Filling the react-select
          as if it were a text box leaves the hidden requiredInput empty, so
          the form rejects both Country and Phone on submit.
        * The <input required aria-hidden> inside the select shell is
          react-select's validation proxy, not a fillable field.
      The Gender select below is the same react-select markup outside the
      phone widget, so it still has to classify normally.
    -->
    <h1>Software Engineer, Full Stack</h1>

    <div class="field-wrapper">
      <label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label>
      <input id="first_name" class="input" type="text" value="" />
    </div>
    <div class="field-wrapper">
      <label id="email-label" for="email" class="label">Email<span aria-hidden="true">*</span></label>
      <input id="email" class="input" type="text" value="" />
    </div>

    <div>
      <fieldset class="phone-input">
      <legend class="visually-hidden">Phone</legend>
      <div class="phone-input__country">
      <div class="select">
      <div class="select__container">
      <label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span>
      </label>
      <div class="select-shell remix-css-b62m3t-container">
      <span id="react-select-country-live-region" class="remix-css-7pg0cj-a11yText">
      </span>
      <span aria-live="polite" aria-atomic="false" aria-relevant="additions text" role="log" class="remix-css-7pg0cj-a11yText">
      </span>
      <div>
      <div class="select__control remix-css-13cymwt-control">
      <div class="select__value-container remix-css-hlgwow">
      <div class="select__placeholder remix-css-1jqq78o-placeholder" id="react-select-country-placeholder">
      </div>
      <div class="select__input-container remix-css-19bb58m" data-value="">
      <input class="select__input" style="opacity: 1" autoCapitalize="none" autoComplete="off" autoCorrect="off" id="country" spellcheck="false" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-errormessage="country-error" aria-invalid="false" aria-labelledby="country-label" aria-required="true" role="combobox" aria-activedescendant="" aria-describedby="react-select-country-placeholder" enterKeyHint="done" value=""/>
      </div>
      </div>
      <div class="select__indicators remix-css-1wy0on6">
      <button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1">
      <svg>
      </svg>
      </button>
      </div>
      </div>
      </div>
      <input required="" tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value=""/>
      </div>
      </div>
      </div>
      </div>
      <div class="phone-input__phone">
      <div class="text-input-wrapper">
      <div class="input-wrapper">
      <label id="phone-label" for="phone" class="label label">Phone<span aria-hidden="true">*</span>
      </label>
      <input id="phone" class="input input__single-line" aria-label="Phone" aria-describedby="phone-description phone-error phone-help" aria-invalid="false" aria-errormessage="phone-error" aria-required="true" type="tel" maxLength="255"/>
      </div>
      </div>
      </div>
      </fieldset>
    </div>

    <div class="field-wrapper">
      <div class="select__container">
        <label id="gender-label" for="gender" class="label select__label">Gender</label>
        <div class="select-shell">
          <div class="select__control">
            <div class="select__input-container">
              <input id="gender" class="select__input" type="text" role="combobox"
                     aria-autocomplete="list" aria-labelledby="gender-label" value="" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="field-wrapper">
      <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
      <button type="button" class="btn btn--pill">Attach</button>
      <input id="resume" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" style="display: none" />
    </div>
  </body>
</html>
