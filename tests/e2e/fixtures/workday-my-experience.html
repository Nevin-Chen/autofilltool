<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Experience — Parallax Labs</title>
</head>
<body>
<main>
  <h1>My Experience</h1>

  <div data-automation-id="workExperienceSection">
    <h3>Work Experience</h3>
    <div data-automation-id="workExperience-1">
      <h4>Work Experience 1</h4>
      <div data-automation-id="formField-jobTitle">
        <label for="wx1-title">Job Title</label>
        <input id="wx1-title" data-automation-id="jobTitle" value="" />
      </div>
      <div data-automation-id="formField-companyName">
        <label for="wx1-company">Company</label>
        <input id="wx1-company" data-automation-id="companyName" value="" />
      </div>
      <div data-automation-id="formField-location">
        <label for="wx1-location">Location</label>
        <input id="wx1-location" data-automation-id="location" value="" />
      </div>
      <div data-automation-id="formField-currentlyWorkHere">
        <label for="wx1-current">I currently work here</label>
        <input type="checkbox" id="wx1-current" data-automation-id="currentlyWorkHere" />
      </div>
      <div data-automation-id="formField-startDate">
        <label for="wx1-from-month">From</label>
        <div data-automation-id="dateSectionMonth-display">
          <input id="wx1-from-month" data-automation-id="dateSectionMonth-input" value="" />
        </div>
        <div data-automation-id="dateSectionYear-display">
          <input id="wx1-from-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
      <div data-automation-id="formField-endDate">
        <label for="wx1-to-month">To</label>
        <div data-automation-id="dateSectionMonth-display">
          <input id="wx1-to-month" data-automation-id="dateSectionMonth-input" value="" />
        </div>
        <div data-automation-id="dateSectionYear-display">
          <input id="wx1-to-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
      <div data-automation-id="formField-roleDescription">
        <label for="wx1-desc">Role Description</label>
        <textarea id="wx1-desc" data-automation-id="roleDescription"></textarea>
      </div>
    </div>
    <div data-automation-id="workExperience-2">
      <h4>Work Experience 2</h4>
      <div data-automation-id="formField-jobTitle">
        <label for="wx2-title">Job Title</label>
        <input id="wx2-title" data-automation-id="jobTitle" value="" />
      </div>
      <div data-automation-id="formField-companyName">
        <label for="wx2-company">Company</label>
        <input id="wx2-company" data-automation-id="companyName" value="" />
      </div>
      <div data-automation-id="formField-location">
        <label for="wx2-location">Location</label>
        <input id="wx2-location" data-automation-id="location" value="" />
      </div>
      <div data-automation-id="formField-currentlyWorkHere">
        <label for="wx2-current">I currently work here</label>
        <input type="checkbox" id="wx2-current" data-automation-id="currentlyWorkHere" />
      </div>
      <div data-automation-id="formField-startDate">
        <label for="wx2-from-month">From</label>
        <div data-automation-id="dateSectionMonth-display">
          <input id="wx2-from-month" data-automation-id="dateSectionMonth-input" value="" />
        </div>
        <div data-automation-id="dateSectionYear-display">
          <input id="wx2-from-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
      <div data-automation-id="formField-endDate">
        <label for="wx2-to-month">To</label>
        <div data-automation-id="dateSectionMonth-display">
          <input id="wx2-to-month" data-automation-id="dateSectionMonth-input" value="" />
        </div>
        <div data-automation-id="dateSectionYear-display">
          <input id="wx2-to-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
      <div data-automation-id="formField-roleDescription">
        <label for="wx2-desc">Role Description</label>
        <textarea id="wx2-desc" data-automation-id="roleDescription"></textarea>
      </div>
    </div>
  </div>

  <div data-automation-id="educationSection">
    <h3>Education</h3>
    <div data-automation-id="education-1">
      <h4>Education 1</h4>
      <div data-automation-id="formField-schoolName">
        <label for="ed1-school">School or University</label>
        <input id="ed1-school" data-automation-id="schoolName" value="" />
      </div>
      <div data-automation-id="formField-degree">
        <label for="ed1-degree">Degree</label>
        <select id="ed1-degree" data-automation-id="degree">
          <option value=""></option>
          <option value="Bachelor's Degree">Bachelor's Degree</option>
          <option value="Master's Degree">Master's Degree</option>
        </select>
      </div>
      <div data-automation-id="formField-fieldOfStudy">
        <label for="ed1-field">Field of Study</label>
        <input id="ed1-field" data-automation-id="fieldOfStudy" value="" />
      </div>
      <div data-automation-id="formField-gradeAverage">
        <label for="ed1-gpa">Overall Result (GPA)</label>
        <input id="ed1-gpa" data-automation-id="gradeAverage" value="" />
      </div>
      <div data-automation-id="formField-startDate">
        <label for="ed1-from-year">From</label>
        <div data-automation-id="dateSectionYear-display">
          <input id="ed1-from-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
    </div>
    <div data-automation-id="education-2">
      <h4>Education 2</h4>
      <div data-automation-id="formField-schoolName">
        <label for="ed2-school">School or University</label>
        <input id="ed2-school" data-automation-id="schoolName" value="" />
      </div>
      <div data-automation-id="formField-degree">
        <label for="ed2-degree">Degree</label>
        <select id="ed2-degree" data-automation-id="degree">
          <option value=""></option>
          <option value="Bachelor's Degree">Bachelor's Degree</option>
          <option value="Master's Degree">Master's Degree</option>
        </select>
      </div>
      <div data-automation-id="formField-fieldOfStudy">
        <label for="ed2-field">Field of Study</label>
        <input id="ed2-field" data-automation-id="fieldOfStudy" value="" />
      </div>
      <div data-automation-id="formField-gradeAverage">
        <label for="ed2-gpa">Overall Result (GPA)</label>
        <input id="ed2-gpa" data-automation-id="gradeAverage" value="" />
      </div>
      <div data-automation-id="formField-startDate">
        <label for="ed2-from-year">From</label>
        <div data-automation-id="dateSectionYear-display">
          <input id="ed2-from-year" data-automation-id="dateSectionYear-input" value="" />
        </div>
      </div>
    </div>
  </div>

  <div data-automation-id="formField-email">
    <label for="contact-email">Email Address</label>
    <input id="contact-email" type="email" data-automation-id="email" value="" />
  </div>

  <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</main>
</body>
</html>
