<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workday "Application Questions" fixture</title>
  </head>
  <body>
    <!--
      Captured from a live <tenant>.wd5.myworkdayjobs.com apply flow, step 3
      ("Application Questions"), with hashed classes and data-uxi-*
      attributes stripped. The employer named in the question text is
      replaced with Globex, and the wrapper ids are made-up hex in the same
      32-character shape as Workday's own.

      Every question is a formField wrapper named by a Workday id, so the
      wrapper name says nothing: the label is the only signal. All but the
      compensation box are listbox buttons whose options mount on click.
    -->
    <div data-automation-id="applyFlowPrimaryQuestionsPage">
      <div data-automation-id="formField-a1c0000000000000000000000000a001" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a001">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a001"><span>Are you currently, or have you previously been employed by Globex, or any of our subsidiaries?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a001" id="primaryQuestionnaire--a1c0000000000000000000000000a001">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a002" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a002">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a002"><span>Preferred Contact Method</span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One" name="a1c0000000000000000000000000a002" id="primaryQuestionnaire--a1c0000000000000000000000000a002">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a003" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a003">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a003"><span>Desired Total Annual Compensation</span></label>
        <input type="text" id="primaryQuestionnaire--a1c0000000000000000000000000a003" name="a1c0000000000000000000000000a003" value="" />
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a004" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a004">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a004"><span>Are you currently eligible to work in the United States and authorized to work for Globex?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a004" id="primaryQuestionnaire--a1c0000000000000000000000000a004">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a005" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a005">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a005"><span>Will you now or in the future require sponsorship by Globex to attain or maintain your employment eligibility?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a005" id="primaryQuestionnaire--a1c0000000000000000000000000a005">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a006" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a006">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a006"><span>Are you willing to relocate?</span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One" name="a1c0000000000000000000000000a006" id="primaryQuestionnaire--a1c0000000000000000000000000a006">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a007" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a007">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a007"><span>Are you currently 18 years of age or older?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a007" id="primaryQuestionnaire--a1c0000000000000000000000000a007">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a008" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a008">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a008"><span>Are you willing to take a drug test if the position requires?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a008" id="primaryQuestionnaire--a1c0000000000000000000000000a008">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a009" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a009">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a009"><span>Based on the job description, do you have the required amount of directly relevant work experience?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a009" id="primaryQuestionnaire--a1c0000000000000000000000000a009">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a00a" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a00a">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a00a"><span>Do you meet the educational requirement as specified in the job description?<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a00a" id="primaryQuestionnaire--a1c0000000000000000000000000a00a">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
      <div data-automation-id="formField-a1c0000000000000000000000000a00b" data-fkit-id="primaryQuestionnaire--a1c0000000000000000000000000a00b">
        <label for="primaryQuestionnaire--a1c0000000000000000000000000a00b"><span>Never miss a new career opportunity! Sign up to receive SMS text notifications of next steps and appointments delivered straight to your device. Frequency varies. Message and data rates may apply.<abbr aria-hidden="true">*</abbr></span></label>
        <div>
          <button aria-haspopup="listbox" type="button" value="" aria-label=" Select One Required" name="a1c0000000000000000000000000a00b" id="primaryQuestionnaire--a1c0000000000000000000000000a00b">Select One</button>
          <input type="text" value="" />
        </div>
      </div>
    </div>
  </body>
</html>
